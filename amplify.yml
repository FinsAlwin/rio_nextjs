version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install Node.js 20 (required by AWS Amplify)
        - nvm install 20
        - nvm use 20
        # Verify Node.js version
        - node --version
        # Install dependencies with legacy peer deps to resolve conflicts
        - npm install --legacy-peer-deps
    build:
      commands:
        # Create .env.production file
        - touch .env.production
        # Add environment variables (only if they exist)
        - env | grep -e AMPLIFY_ >> .env.production || true
        - env | grep -e NEXT_PUBLIC_ >> .env.production || true
        - env | grep -e NEXTAUTH_URL >> .env.production || true
        - env | grep -e NEXTAUTH_SECRET >> .env.production || true
        - env | grep -e MONGODB_URI >> .env.production || true

        # Build the application
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
